<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Chat!</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: monospace, Courier, serif; background-color: #fff; color: #000; margin: 4%; font-size: 16px; line-height: 1.4; }
        .board-container { max-width: 500px; margin: 0 auto; text-align: center; }
        .board-title { font-weight: bold; font-size: 16px; border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 15px; text-transform: uppercase; }

        
        /* Chat Feed Box Layout */
        .message-feed { border: 2px solid #000; height: 260px; overflow-y: scroll; text-align: left; padding: 8px; background: #fff; margin-bottom: 15px; }
        .msg-bubble { border-bottom: 1px dashed #000; padding: 6px 0; margin-bottom: 4px; font-size: 14px; }
        .msg-user { font-weight: bold; text-decoration: underline; }
        .msg-time { font-size: 11px; color: #555; float: right; }
        
        /* Form Field Layout Inputs */
        .input-row { margin-bottom: 10px; text-align: left; }
        .input-label { font-size: 13px; font-weight: bold; display: block; margin-bottom: 3px; }
        .field-box { width: 95%; padding: 8px; border: 2px solid #000; font-family: monospace; font-size: 15px; background: #fff; }
        
        /* Buttons */
        .btn-submit { display: block; width: 100%; text-align: center; padding: 12px 0; background-color: #000; color: #fff; font-weight: bold; font-size: 15px; text-decoration: none; border: 2px solid #000; cursor: pointer; }
        .btn-submit:active { background-color: #fff; color: #000; }
        .btn-small { padding: 5px 10px; background: #000; color: #fff; border: 2px solid #000; font-family: monospace; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-small:active { background: #fff; color: #000; }
        .btn-small-outline { padding: 5px 10px; background: #fff; color: #000; border: 2px solid #000; font-family: monospace; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-small-outline:active { background: #000; color: #fff; }
        
        .btn-back { display: inline-block; margin-top: 20px; padding: 10px 16px; background: #fff; border: 2px solid #000; font-weight: bold; text-decoration: none; color: #000; font-size: 14px; }
    </style>
</head>
<body>
<div class="board-container">
    <div class="board-title">Online chat!</div>

    <p style="font-size: 13px; font-style: italic; margin-bottom: 15px;">Congrats on making it into the chat! You can now chat with people!</p>

    <!-- LIVE CONVERSATION STREAM FEED -->
    <div class="message-feed" id="chat-stream">
        Loading recent messages...
    </div>

    <!-- TRANSMIT REQUEST FORM INTERFACE -->
    <div class="input-row">
        <span class="input-label">&gt; Username:</span>
        <input type="text" id="user-name" class="field-box" placeholder="ChatUser1234" maxlength="15">
    </div>
    
    <div class="input-row">
        <span class="input-label">&gt; Message:</span>
        <input type="text" id="user-msg" class="field-box" placeholder="Hi everyone!" maxlength="80">
    </div>

    <button class="btn-submit" onclick="submitRequestMessage()">Send</button>

    <!-- Navigation Footer -->
    <div>
        <a href="index.html" class="btn-back">Back to homepage</a>
    </div>
</div>
<script>
    var SUPABASE_URL = "https://hzcnqfzyehoctkviyfwf.supabase.co"; 
    var SUPABASE_KEY = "sb_publishable_mEl59NFDbz1V7YS_kO_OTw_4PnkhrNT"; 

    // 🛠️ ADMIN CONFIGURATION LIST
    // Add your admin emails here. Their role remains completely invisible on the feed.
    var ADMIN_EMAILS = [
        "thecoderboss@chat.com",
        "yourname@domain.com"
    ];

    // Session tracking variables stored locally in the browser
    var SESSION_TOKEN = localStorage.getItem("supabase_session_token") || null;
    var USER_EMAIL = localStorage.getItem("supabase_user_email") || null;


    function logoutUser() {
        SESSION_TOKEN = null;
        USER_EMAIL = null;
        localStorage.removeItem("supabase_session_token");
        localStorage.removeItem("supabase_user_email");
        updateAuthUI();
        fetchRequestMessages();
    }
// 🔐 GATEKEEPER CHECK: Protect page from unauthorized sessions
function enforceGatekeeperCheck() {
    var sessionToken = localStorage.getItem("supabase_session_token");
    var userEmail = localStorage.getItem("supabase_user_email");

    if (!sessionToken || !userEmail) {
        // Not logged in -> boot them to your new login page
        window.location.href = "login.html";
    } else {
        // Logged in -> extract the prefix before the '@' to use as the username
        var automaticallyDerivedUsername = userEmail.split('@')[0];
        
        // Auto-fill and lock down the input element so it cannot be manually changed
        var usernameInput = document.getElementById("user-name");
        if (usernameInput) {
            usernameInput.value = automaticallyDerivedUsername;
            usernameInput.disabled = true; // Prevents manual editing
            usernameInput.style.backgroundColor = "#eee"; // Visual indicator it is locked
        }
    }
}

    function checkIsAdmin(emailField) {
        if (!emailField) return false;
        return ADMIN_EMAILS.includes(emailField.toLowerCase());
    }
      
        xhr.send(JSON.stringify({ "email": email, "password": password }));
    }

    function fetchRequestMessages() {
        var feed = document.getElementById("chat-stream");
        var xhr = new XMLHttpRequest();
        xhr.open("GET", SUPABASE_URL + "/rest/v1/online_chat?select=*&order=created_at.desc&limit=15", true);
        xhr.setRequestHeader("apikey", SUPABASE_KEY);
        
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && (xhr.status === 200 || xhr.status === 201)) {
                var data = JSON.parse(xhr.responseText);
                var htmlBuffer = "";
                if (data.length === 0) {
                    feed.innerHTML = "<div style='text-align:center; padding-top:40px; font-style:italic;'>The board is empty.</div>";
                    return;
                }
                for (var i = 0; i < data.length; i++) {
                    var timeStr = "--:--";
                    try {
                        var dateObj = new Date(data[i].created_at);
                        timeStr = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    } catch(e) {}

                    htmlBuffer += "<div class='msg-bubble'>" +
                        "<span class='msg-time'>" + timeStr + "</span>" +
                        "<span class='msg-user'>" + escapeHtml(data[i].name) + "</span>: " +
                        "<span>" + escapeHtml(data[i].message) + "</span>" +
                        "</div>";
                }
                feed.innerHTML = htmlBuffer;
            }
        };
        xhr.send();
    }

    function submitRequestMessage() {
        var nameInput = document.getElementById("user-name").value.trim();
        var msgInput = document.getElementById("user-msg").value.trim();

        if (!nameInput || !msgInput) return alert("Fill all fields!");

        var xhr = new XMLHttpRequest();
        xhr.open("POST", SUPABASE_URL + "/rest/v1/online_chat", true);
        xhr.setRequestHeader("apikey", SUPABASE_KEY);
        xhr.setRequestHeader("Content-Type", "application/json");
        
        if (SESSION_TOKEN) xhr.setRequestHeader("Authorization", "Bearer " + SESSION_TOKEN);

        var payloadData = { "name": nameInput, "message": msgInput };
        if (USER_EMAIL) {
            payloadData.email = USER_EMAIL;
            if (checkIsAdmin(USER_EMAIL)) payloadData.is_admin = true;
        }

        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status >= 200 && xhr.status <= 299) {
                document.getElementById("user-msg").value = "";
                fetchRequestMessages(); 
            }
        };
        xhr.send(JSON.stringify(payloadData));
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Run initialization checks on startup
    if(USER_EMAIL && document.getElementById("user-name").value === "") {
        document.getElementById("user-name").value = USER_EMAIL.split('@')[0];
    }
    fetchRequestMessages();
    // Call this right at the very bottom of your script area to protect the page immediately on load
enforceGatekeeperCheck();
</script>
</body>
</html>
